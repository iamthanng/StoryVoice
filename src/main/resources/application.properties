# Application Name & Port
spring.application.name=StoryVoice
server.port=8080

# Database Connection (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/story_voice?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configurations
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# JWT Security Configurations
# Secret key ph\u1EA3i \u0111\u1EE7 256 bits (32+ ký t\u1EF1) cho thuật toán HS256 / HS512
app.jwt.secret=StoryVoiceSecretKeyForJWTAuthentication2026SecureKeyWithMin256BitsLength!
app.jwt.expiration-ms=86400000

# Text-To-Speech (FPT.AI API) Configurations
app.tts.fpt-api-key=YOUR_FPT_AI_API_KEY_HERE
app.tts.fpt-api-url=https://api.fpt.ai/hcm/v3/tts
app.tts.voice=banmai
app.tts.speed=0

# Swagger / OpenAPI UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

